name: Inba Mart DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Dependency audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t inba-mart-backend:ci ./backend

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inba-mart-backend:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://inba-mart-alb-558020297.ap-south-1.elb.amazonaws.com"
          allow_issue_writing: false
          artifact_name: zap-baseline-report

  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [security, dast]

    # Only push/deploy from the main branch.
    # Pull requests should run security/DAST but must not push images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::149146127980:role/GitHubActions-InbaMart-Deploy
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/inba-mart-backend:${{ github.sha }} ./backend
          docker tag ${{ steps.login-ecr.outputs.registry }}/inba-mart-backend:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/inba-mart-backend:latest

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/inba-mart-backend:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/inba-mart-backend:latest

  deploy:
    name: Deploy to ASG
    runs-on: ubuntu-latest
    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::149146127980:role/GitHubActions-InbaMart-Deploy
          aws-region: ap-south-1

      - name: Check for Existing ASG Instance Refresh
        id: check-refresh
        run: |
          REFRESH_ID=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name inba-mart-backend-asg \
            --query "InstanceRefreshes[?Status=='Pending' || Status=='InProgress' || Status=='Baking' || Status=='Cancelling' || Status=='RollbackInProgress'] | [0].InstanceRefreshId" \
            --output text)

          if [ "$REFRESH_ID" = "None" ] || [ -z "$REFRESH_ID" ]; then
            echo "No active instance refresh found."
            echo "REFRESH_ID=" >> "$GITHUB_ENV"
          else
            echo "Existing instance refresh found: $REFRESH_ID"
            echo "REFRESH_ID=$REFRESH_ID" >> "$GITHUB_ENV"
          fi

      - name: Start ASG Instance Refresh
        if: env.REFRESH_ID == ''
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name inba-mart-backend-asg \
            --preferences '{"MinHealthyPercentage":100,"InstanceWarmup":300}' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "REFRESH_ID=$REFRESH_ID" >> "$GITHUB_ENV"
          echo "Started Instance Refresh: $REFRESH_ID"

      - name: Wait for ASG Instance Refresh
        run: |
          echo "Waiting for Instance Refresh: $REFRESH_ID"

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name inba-mart-backend-asg \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            PROGRESS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name inba-mart-backend-asg \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].PercentageComplete' \
              --output text)

            echo "Status: $STATUS | Progress: ${PROGRESS}%"

            case "$STATUS" in
              Successful)
                echo "Instance Refresh completed successfully."
                break
                ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                echo "Instance Refresh failed with status: $STATUS"
                exit 1
                ;;
              *)
                sleep 30
                ;;
            esac
          done
          