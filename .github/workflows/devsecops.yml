name: Inba Mart DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  oidc-debug:
    name: Debug GitHub OIDC
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get OIDC token claims
        shell: bash
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Dependency audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t inba-mart-backend:ci ./backend

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inba-mart-backend:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://inba-mart-alb-558020297.ap-south-1.elb.amazonaws.com"
          allow_issue_writing: false
          artifact_name: zap-baseline-report

  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [security, dast]

    # Only push/deploy from the main branch.
    # Pull requests should run security/DAST but must not push images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::149146127980:role/GitHubActions-InbaMart-Deploy
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/inba-mart-backend:${{ github.sha }} ./backend
          docker tag ${{ steps.login-ecr.outputs.registry }}/inba-mart-backend:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/inba-mart-backend:latest

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/inba-mart-backend:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/inba-mart-backend:latest
